packages:
  - 'packages/*'

# pnpm blocks arbitrary install/postinstall scripts by default (supply-chain
# guard). better-sqlite3 needs its native-addon build (node-gyp/prebuild-
# install) and esbuild (a vite/vitest transitive dep) needs its postinstall to
# fetch its platform binary — both explicitly allow-listed here. `allowBuilds`
# is the field pnpm 11 recognizes (it auto-writes this block; the older
# `onlyBuiltDependencies` list yields ERR_PNPM_IGNORED_BUILDS on pnpm 11.12).
allowBuilds:
  better-sqlite3: true
  esbuild: true

# Keep pnpm's content-addressable store INSIDE this workspace so that, in an
# environment where the global store is on a different volume than the checkout
# (some CI/cloud runners), pnpm's same-volume fallback never leaks a stray
# `.pnpm-store/` into the parent (engine) repo root. `.pnpm-store/` is gitignored.
storeDir: .pnpm-store

# #1639 — eslint-plugin-jsx-a11y 6.10.2 (the latest, pinned) declares a peer of
# eslint ^3..^9 and studio is on eslint 10. It was checked to load and run under
# eslint 10 and to call none of the context methods eslint 10 removed. Allowed
# for eslint 10 only, so a later eslint major warns again and is re-checked.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
