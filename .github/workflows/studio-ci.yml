name: studio-ci

on:
  push:
    branches: [main]
    paths: ['studio/**', '.github/workflows/studio-ci.yml']
  pull_request:
    paths: ['studio/**', '.github/workflows/studio-ci.yml']

defaults:
  run:
    working-directory: studio

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # NOTE: we do NOT use setup-node's `cache: pnpm`. That helper resolves the
      # store via `pnpm store path` run from the repo ROOT, where it cannot see
      # studio/pnpm-workspace.yaml's `storeDir: .pnpm-store` (action steps ignore
      # `defaults.run.working-directory`), so it targets the GLOBAL store — which
      # `pnpm install` (run in studio/) never populates. On any lockfile change
      # the post-job cache-save then fails with "path does not exist". We cache
      # the real store dir explicitly instead.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: studio/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('studio/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Zero-paid-dependency audit (P7, #409): every prod + dev dependency must
      # carry a permissive OSS license. Fails closed on any non-permissive or
      # unknown license, or a degenerate/empty tree. See packages/cli/src/licenseAudit.ts.
      - name: Audit licenses
        run: pnpm run audit:licenses

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # End-to-end (#713). Added as STEPS of this job, not as a second job, so
      # the check name stays `studio` and branch protection's required-checks
      # list needs no change.
      #
      # These run on EVERY studio PR rather than only web-touching diffs: the
      # specs boot the real Fastify server and assert on the built SPA, so a
      # server-side regression can break them just as a CSS one can, and a
      # path-filtered gate would miss exactly that. The cost is bounded — one
      # chromium, ~4s of specs.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('studio/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # Split from the browser download on purpose: the system libraries are
      # apt-installed into the runner image, NOT into the cached browser dir, so
      # they must be (re)installed even on a cache hit.
      - name: Install Playwright system deps
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      # `test:e2e` rebuilds (it is the one self-contained command #713 asks CI
      # and the loop to share). That duplicates the `Build` step above by
      # ~20s — accepted, to keep one command with no CI-only variant.
      - name: E2E
        id: e2e
        run: pnpm test:e2e

      # Scoped to THIS step: a bare `if: failure()` also fires when Lint or
      # Typecheck failed, when no report exists to upload.
      - name: Upload e2e report on failure
        if: failure() && steps.e2e.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: studio/playwright-report
          retention-days: 7
